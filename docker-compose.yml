version: '3.8'

services:
  ramazon-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ramazon-bot
    restart: always  # Production uchun 'always'
    
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ADMIN_ID=${ADMIN_ID}
      - TIMEZONE=${TIMEZONE:-Asia/Tashkent}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    volumes:
      - ./data:/app/data
      - ./generated_images:/app/generated_images
      - ./logs:/app/logs
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    
    networks:
      - bot-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/user_data.json') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    
    # Auto-update with Watchtower (ixtiyoriy)
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower - avtomatik yangilanish (ixtiyoriy)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400  # Har 24 soatda tekshirish
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16